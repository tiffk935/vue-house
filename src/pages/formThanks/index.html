<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <%- include('src/components/meta.ejs') %>
  <style>
    body {
      margin: 0;
    }
    a {
      text-decoration: none;
    }
    .thanks {
      width: 100vw;
      height: 100vh;
      background: url(//h35.banner.tw/img//thank_bg.png);
      background-position-x: 0%;
      background-position-y: 0%;
      background-size: auto;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .thanks .img {
      width: 90vw;
      position: absolute;
      opacity: 1;
    }
    .thanks .img-hover {
      width: 90vw;
      opacity: 0;
    }
    .thanks a:hover .img {
      opacity: 0;
    }
    .thanks a:hover .img-hover {
      opacity: 1;
    }
    @media screen and (min-width: 768px) {
      .thanks .img, .thanks .img-hover {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="thanks">
    <a href="/">
      <img class="img" src="//h35.banner.tw/img//thank-img.png" alt="thank" />
      <img class="img-hover" src="//h35.banner.tw/img//thank-img-hover.png" alt="thank" />
    </a>
  </div>
</body>
</html>
